name: Build .NET
on:
  push:
    branches: [main, 'sprint*/**']
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore MinhaBelem.sln
      - run: dotnet build MinhaBelem.sln --no-restore --configuration Release
      - run: dotnet test MinhaBelem.sln --no-build --configuration Release --filter "FullyQualifiedName~SecurityTests|FullyQualifiedName~DiscoveryTests|FullyQualifiedName~InternationalizationTests|FullyQualifiedName~MobilityAndCommunityTests|FullyQualifiedName~RadarCrawlerTests" --logger trx --results-directory TestResults
  mysql-http:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      MINHABELEM_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;SslMode=None
      OCR_TEST_EXECUTABLE: /usr/bin/tesseract
      OCR_TEST_FFMPEG: /usr/bin/ffmpeg
      OCR_TEST_VIDEO: /tmp/minhabelem-poster.mp4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Preparar processadores reais de mídia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por ffmpeg
          ffmpeg -loglevel error -loop 1 -i tests/MinhaBelem.Tests/Fixtures/poster.png -t 1 -pix_fmt yuv420p -movflags +faststart /tmp/minhabelem-poster.mp4
      - run: dotnet restore MinhaBelem.sln
      - run: dotnet test MinhaBelem.sln --configuration Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-http-test-results
          path: TestResults/*.trx
