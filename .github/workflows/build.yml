name: Build .NET
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/MinhaBelem.Web/MinhaBelem.Web.csproj
      - run: dotnet build src/MinhaBelem.Web/MinhaBelem.Web.csproj --no-restore --configuration Release
